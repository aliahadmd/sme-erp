[project]
name = "erp-cloudflare"
version = "0.1.0"
description = "Cloudflare Workers runtime for SME ERP"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "sqlalchemy-cloudflare-d1==0.4.1",
    "workers-runtime-sdk==1.9.6",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "uuid-utils==1.0.0",
    "workers-py==1.17.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "../api"]
