name: erp

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    # Host ports avoid clashes with other local Docker projects (e.g. 5432/6379/8333).
    # Inside the docker network the services keep their canonical names/ports.
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    # s3.json is generated from env at start — no credentials live in git.
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<EJS
        {
          "identities": [
            {
              "name": "erp",
              "credentials": [
                { "accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY" }
              ],
              "actions": ["Admin", "Read", "Write", "List"]
            }
          ]
        }
        EJS
        exec weed server -dir=/data -ip=seaweedfs -master.volumeSizeLimitMB=1024 -volume.max=0 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-erp}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-erpdevsecret}
    ports:
      - "18333:8333"
      - "19333:9333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://seaweedfs:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  # One-shot: create the dev bucket if missing. Safe to run on every `make up`.
  seaweed-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-erp}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-erpdevsecret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["sh", "-c"]
    command: >
      'aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ${S3_BUCKET:-erp-dev}
      || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket ${S3_BUCKET:-erp-dev}'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Sync deps from the mounted lockfile at start (no stale venv volume).
    command:
      ["sh", "-c", "uv sync --frozen && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - uv_cache:/root/.cache/uv
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    command: ["sh", "-c", "pnpm approve-builds --all && pnpm install --ignore-scripts && pnpm dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      npm_config_store_dir: /pnpm/store
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5173 >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

volumes:
  pgdata:
  redisdata:
  s3data:
  uv_cache:
  web_node_modules:
  pnpm_store:
