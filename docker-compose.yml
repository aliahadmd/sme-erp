name: erp

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    # Host ports avoid clashes with other local Docker projects (e.g. 5432/6379/8333).
    # Inside the docker network the services keep their canonical names/ports.
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    # s3.json is generated from env at start — no credentials live in git.
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<EJS
        {
          "identities": [
            {
              "name": "erp",
              "credentials": [
                { "accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY" }
              ],
              "actions": ["Admin", "Read", "Write", "List"]
            }
          ]
        }
        EJS
        exec weed server -dir=/data -ip=seaweedfs -master.volumeSizeLimitMB=1024 -volume.max=0 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-erp}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-erpdevsecret}
    ports:
      - "18333:8333"
      - "19333:9333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://seaweedfs:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  # One-shot: create the dev bucket if missing. Safe to run on every `make up`.
  seaweed-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-erp}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-erpdevsecret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["sh", "-c"]
    # The S3 gateway comes up after the master is healthy — retry until the
    # bucket exists (or is created), then exit.
    command: >
      'for i in $$(seq 1 30); do
      aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ${S3_BUCKET:-erp-dev} 2>/dev/null && exit 0;
      aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket ${S3_BUCKET:-erp-dev} >/dev/null 2>&1 && exit 0;
      sleep 2; done; echo "bucket init failed"; exit 1'

  # api / worker / web: source is baked into the images (no bind mounts —
  # Docker Desktop cannot share the SSD volume this repo lives on). `make up`
  # rebuilds them; for live reload run `make infra` + `make dev-api` /
  # `make dev-worker` / `make dev-web` on the host.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      JOBS_MODE: ${JOBS_MODE:-redis}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["arq", "app.jobs.WorkerSettings"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  s3data:
