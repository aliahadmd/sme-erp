# Production deployment compose — used by Dokploy (and `make deploy-check`).
# All configuration comes from the environment (.env); no source mounts.
name: erp-prod

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in env}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    # s3.json generated from env — credentials never live in git.
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<EJS
        {
          "identities": [
            {
              "name": "erp",
              "credentials": [
                { "accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY" }
              ],
              "actions": ["Admin", "Read", "Write", "List"]
            }
          ]
        }
        EJS
        exec weed server -dir=/data -ip=seaweedfs -master.volumeSizeLimitMB=1024 -volume.max=0 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in env}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://seaweedfs:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s

  seaweed-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["sh", "-c"]
    command: >
      'aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ${S3_BUCKET:-erp}
      || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket ${S3_BUCKET:-erp}'

  api:
    build:
      context: .
      dockerfile: docker/api.prod.Dockerfile
    environment: &app-env
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DATABASE_URL: ${DATABASE_URL:?set in env}
      REDIS_URL: ${REDIS_URL:?set in env}
      JWT_SECRET: ${JWT_SECRET:?set in env}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in env}
      S3_BUCKET: ${S3_BUCKET:-erp}
      S3_REGION: ${S3_REGION:-us-east-1}
      JOBS_MODE: ${JOBS_MODE:-redis}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # bootstrap (seeded idempotently at every start)
      ORG_NAME: ${ORG_NAME:-My Company}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set in env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in env}
      # email (empty SMTP_HOST = emails are logged, not sent)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-erp@example.com}
      # AI (empty key = AI features disabled)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-200}
      # retention & backups
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/api.prod.Dockerfile
    entrypoint: ["sh", "-c", "exec arq app.jobs.WorkerSettings"]
    healthcheck:
      # The worker writes jobs:heartbeat every minute (180 s TTL).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis, sys; sys.exit(0 if redis.from_url(os.environ['REDIS_URL']).get('jobs:heartbeat') else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 90s
    environment:
      <<: *app-env
      JOBS_MODE: redis
    volumes:
      # Local backup copies survive redeploys (S3 holds the off-box copy).
      - dumps:/app/dumps
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.prod.Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "${PROXY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  s3data:
  dumps:
